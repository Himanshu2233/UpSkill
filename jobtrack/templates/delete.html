{% extends 'base.html' %}{% block title %}Confirm deletion{% endblock %}
{% block content %}<section class="panel confirmation"><span class="eyebrow">CONFIRM DELETION</span><h1>Delete this application?</h1><p>The application for <strong>{{ application.title }}</strong> at <strong>{{ application.company }}</strong> will be permanently removed.</p><form method="post">{{ form.hidden_tag() }}<div class="form-actions"><button class="btn btn-danger">Yes, delete application</button><a class="btn btn-outline-secondary" href="{{ url_for('tracker.detail', application_id=application.id) }}">Keep application</a></div></form></section>{% endblock %}
