<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}JobTrack{% endblock %} · JobTrack</title>
  <link href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar"><nav class="container nav-content" aria-label="Main navigation">
    <a class="brand" href="{{ url_for('tracker.dashboard') }}"><span class="brand-mark">J</span> JobTrack<span class="brand-dot">.</span></a>
    {% if current_user.is_authenticated %}<div class="nav-actions"><a href="{{ url_for('tracker.dashboard') }}">Dashboard</a><form action="{{ url_for('auth.logout') }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-sm btn-outline-secondary">Log out</button></form></div>{% else %}<a class="nav-link" href="{{ url_for('auth.login') }}">Log in</a>{% endif %}
  </nav></header>
  <main class="container main-content">
    {% for category, message in get_flashed_messages(with_categories=true) %}<div class="alert alert-{{ category }}" role="status">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
  <footer class="container footer"><span>Small steps. New opportunities.</span><span>Made with Python & Flask</span></footer>
</body>
</html>
